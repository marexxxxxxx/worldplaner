[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldplaner-backend"
version = "0.1.0"
description = "Kiosk-Dashboard-MVP — Backend (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.setuptools.package-data]
app = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
