[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldplaner-mcp-server"
version = "0.1.0"
description = "Kiosk-Dashboard-MVP — MCP-Server (Streamable HTTP), 8 Tools"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "pydantic-settings>=2.3",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
