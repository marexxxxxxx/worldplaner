# Spezifikation H.1 nennt drei Services (backend, garmin-sync, mcp-server).
# Vorhanden sind `backend` (K1/WP-2) und `mcp-server` (K3/WP-8). `garmin-sync/`
# existiert noch nicht (WP-5) und wuerde den Build brechen; der Service wird
# erst mit WP-5 ergaenzt.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    volumes:
      - sqlite-data:/data
      # Frontend + Widgets werden vom Backend ausgeliefert (D10). Im Container
      # liegt `backend/app/main.py` unter /app/app -> project_root ist "/",
      # deshalb werden die Verzeichnisse dort eingehängt (K2/WP-3).
      - ./frontend:/frontend:ro
      - ./widgets:/widgets:ro
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_PATH=/data/dashboard.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    ports: ["127.0.0.1:${MCP_PORT:-8001}:8001"]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # Display-Steuerung (J.2)
    env_file:
      - path: .env
        required: false
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - BACKEND_URL=http://backend:8000
      - DISPLAY_OUTPUT=${DISPLAY_OUTPUT:-eDP-1}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite-data:
