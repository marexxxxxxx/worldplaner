# Spezifikation H.1 nennt drei Services (backend, garmin-sync, mcp-server).
# `garmin-sync` (WP-5) ist der einzige Schreiber von `garmin_cache` (A.2/D4); das
# Backend liest diese Tabelle ausschliesslich.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    volumes:
      - sqlite-data:/data
      # Frontend + Widgets werden vom Backend ausgeliefert (D10). Im Container
      # liegt `backend/app/main.py` unter /app/app -> project_root ist "/",
      # deshalb werden die Verzeichnisse dort eingehängt (K2/WP-3).
      - ./frontend:/frontend:ro
      - ./widgets:/widgets:ro
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_PATH=/data/dashboard.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    ports: ["127.0.0.1:${MCP_PORT:-8001}:8001"]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # Display-Steuerung (J.2)
    env_file:
      - path: .env
        required: false
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - BACKEND_URL=http://backend:8000
      - DISPLAY_OUTPUT=${DISPLAY_OUTPUT:-eDP-1}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  garmin-sync:
    build: ./garmin-sync
    restart: unless-stopped
    volumes:
      - garmin-token:/data/token      # persistente Garmin-Session (G.3)
      - sqlite-data:/data/db          # dieselbe DB-Datei (H.1)
    env_file:
      - path: .env
        required: false
    environment:
      - GARMIN_TOKEN_DIR=/data/token
      - GARMIN_DB_PATH=/data/db/dashboard.db
      # Nur Verifikation ohne echten Account: GARMIN_SYNC_MOCK=1 schreibt
      # synthetische Cache-Zeilen im Schema G.5 (Default 0 = echter Client).
      - GARMIN_SYNC_MOCK=${GARMIN_SYNC_MOCK:-0}
    # Erst schreiben, wenn das Backend das Schema angelegt hat (C/A.2).
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
  garmin-token:
